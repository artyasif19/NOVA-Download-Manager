
name: Build NOVA for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: TypeScript check
        run: npm run lint
      - name: Start NOVA test server
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm start" -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 3000 -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            throw "NOVA server did not start on port 3000"
          }

      - name: Run tests
        run: npm test

      - name: Download video tools (yt-dlp and ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/binaries/yt-dlp.exe"
          $ffmpegUrls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip",
            "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $downloaded = $false
          foreach ($u in $ffmpegUrls) {
            try {
              Write-Host "Trying $u"
              Invoke-WebRequest -Uri $u -OutFile "ffmpeg.zip"
              $downloaded = $true
              break
            } catch {
              Write-Host "Failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) { throw "Could not download ffmpeg from any source" }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpeg = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg/ffprobe not found in download" }
          Copy-Item $ffmpeg.FullName "src-tauri/binaries/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "src-tauri/binaries/ffprobe.exe"
          if (-not (Test-Path "src-tauri/binaries/yt-dlp.exe")) { throw "yt-dlp.exe download failed" }
          Get-ChildItem src-tauri/binaries | Format-Table Name, Length

      - name: Build browser helper (nova_host) and stage extensions
        shell: pwsh
        working-directory: src-tauri
        run: |
          # Extensions first: the Tauri build script checks that bundled resource paths exist
          New-Item -ItemType Directory -Force -Path "ext-chrome" | Out-Null
          New-Item -ItemType Directory -Force -Path "ext-firefox" | Out-Null
          Copy-Item "../extension/chrome/*" "ext-chrome/" -Recurse -Force
          Copy-Item "../extension/firefox/*" "ext-firefox/" -Recurse -Force
          cargo build --release --bin nova_host
          if (-not (Test-Path "target/release/nova_host.exe")) { throw "nova_host.exe was not built" }
          Copy-Item "target/release/nova_host.exe" "binaries/nova_host.exe" -Force
          Get-ChildItem -Recurse binaries | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build NOVA application
        run: npm run tauri build

      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item 'src-tauri/target/release/bundle/nsis/*.exe' release-artifacts/ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem release-artifacts -File)) {
            throw 'No installer was produced.'
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-x64-release
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
