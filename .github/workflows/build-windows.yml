
name: Build NOVA for Windows

on:
  workflow_dispatch:
  push:
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:

  build:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Windows application and installers
        run: npm run tauri build

      - name: Prepare extension packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          if (Test-Path 'src-tauri/target/release/bundle/nsis') { Copy-Item 'src-tauri/target/release/bundle/nsis/*.exe' release-artifacts/ -ErrorAction SilentlyContinue }
          if (Test-Path 'src-tauri/target/release/bundle/msi') { Copy-Item 'src-tauri/target/release/bundle/msi/*.msi' release-artifacts/ -ErrorAction SilentlyContinue }
          if (Test-Path 'src-tauri/target/release/nova_host.exe') { Copy-Item 'src-tauri/target/release/nova_host.exe' release-artifacts/ }
          Compress-Archive -Path extension/chrome/* -DestinationPath release-artifacts/nova-chromium-extension.zip -Force
          Compress-Archive -Path extension/firefox/* -DestinationPath release-artifacts/nova-firefox-extension.zip -Force
          if (-not (Get-ChildItem release-artifacts -File)) { throw 'No release artifacts were produced.' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows-x64-release
          path: release-artifacts/*

          if-no-files-found: error
          retention-days: 14
