<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0c0e12;
      color: #e2e8f0;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .brand {
      font-weight: 700;
      color: #06b6d4;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .toggle {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>NOVA</span>
      <span style="color: #94a3b8; font-weight: normal;">Bridge</span>
    </div>
    <div class="status-badge" id="hostStatus">Connected</div>
  </div>

  <div class="row">
    <span>Intercept Browser Downloads</span>
    <input type="checkbox" id="autoIntercept" checked>
  </div>

  <div class="row">
    <span>Floating Video Sniffer</span>
    <input type="checkbox" id="floatingSniffer" checked>
  </div>

  <div style="margin-top: 10px; text-align: center; color: #64748b; font-size: 10px;">
    NOVA Download Manager v2.4 Native Core
  </div>

  <script src="popup.js"></script>
</body>
</html>
