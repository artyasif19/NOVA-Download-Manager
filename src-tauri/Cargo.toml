[package]
name = "nova-download-manager"
version = "2.4.0"
description = "High-performance, privacy-first Windows download manager inspired by IDM"
authors = ["NOVA Core Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-notification = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full", "net", "io-util"] }
reqwest = { version = "0.12", features = ["stream", "json", "cookies", "gzip", "brotli", "blocking"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
parking_lot = "0.12"
chrono = "0.4"
suppaftp = { version = "=8.0.5", default-features = false, features = ["tokio-async-native-tls"] }
ssh2 = "0.9"
rand = "0.8"

[[bin]]
name = "nova-download-manager"
path = "src/main.rs"

[[bin]]
name = "nova_host"
path = "src/native_host.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
